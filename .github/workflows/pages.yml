name: Publish Spatial Review branch

on:
  push:
    branches: [spatial-review-integration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_REVIEW_BUILD_ID: ${{ github.sha }}
      - run: npm run verify:publish
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify published discovery and exact build files
        run: npm run verify:publish
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
